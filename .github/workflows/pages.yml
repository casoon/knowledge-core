name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No project build needed: the site only reads source files from apps/ at build time.

      # pnpm version from "packageManager" in the root package.json; setting `version` here
      # as well fails with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - uses: actions/configure-pages@v6

      # site/ has its own pnpm-workspace.yaml (packages: []), so the install stays out of the
      # root workspace and uses site/pnpm-lock.yaml.
      - name: Build site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
