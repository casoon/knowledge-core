packages:
  - 'apps/*'
  - 'packages/*'
  - 'shared'

onlyBuiltDependencies:
  - '@casoon/astro-post-audit'

catalog:
  # Astro v7
  astro: ^7.2.10
  '@astrojs/check': ^0.9.10
  '@astrojs/mdx': ^8.0.0
  '@casoon/astro-post-audit': ^0.5.3
  '@casoon/astro-site-files': ^0.4.2
  '@casoon/astro-speed-measure': ^0.4.0

  # Tailwind v4
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3

  # Core
  # astro check currently requires the TypeScript 6 programmatic API
  typescript: ^6.0.3
  '@types/node': ^24.10.0
  zod: ^4.5.4
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  sharp: ^0.35.4

  # Formatting & Linting (Biome only - no more ESLint/Prettier hybrid)
  '@biomejs/biome': ^2.5.11
  husky: ^9.1.7
  lint-staged: ^17.4.1

  # Fonts
  '@fontsource/inter': ^5.2.8

  # Testing
  vitest: ^4.1.11
  check-html-links: ^0.2.4
